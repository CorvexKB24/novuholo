<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>. . .</title>
    <link rel="stylesheet" href="style.css">
    <script src="../../jquery.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../../img/novu_icon.png">
</head>

<body>
    <div id="scene">
        <div id="ui">
            <div class="buttons clickable" id="act" onclick="triggerCode()"></div>
            <div class="buttons clickable" id="arrowup" onclick="triggerChangeNumber('up')"></div>
            <div class="buttons clickable" id="arrowdown" onclick="triggerChangeNumber('down')"></div>
        </div>

        <div id="code">
            <img id="arrows" src="../../img/arrows.png">

            <p>
                <span id="num1" class="clickable selected" onclick="changeSelection(1)">0</span>
                <span id="num2" class="clickable" onclick="changeSelection(2)">0</span>
                <span id="num3" class="clickable" onclick="changeSelection(3)">0</span>
                <span id="num4" class="clickable" onclick="changeSelection(4)">0</span>
            </p>

            <img id="button" src="../../img/button.png">
        </div>

        <div id="dialoguetext">
            <table id="text_speak">
                <tr>
                    <td id="dialogue"></td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
